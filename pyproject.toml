[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-open"
version = "0.1.0"
description = "Independent, SMPL-based development implementation of LUNA"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "Pillow>=10", "PyYAML>=6", "joblib>=1.3",
  "torch==2.8.0", "torchvision==0.23.0", "gsplat==1.5.3",
  "opencv-python-headless>=4.10", "scipy>=1.12", "smplx==0.1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "ninja>=1.11"]
features = ["transformers>=4.56,<5", "huggingface-hub>=0.34", "lpips==0.1.4"]

[project.scripts]
luna-data = "luna_open.data.neuman:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and compiles the gsplat extension"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
