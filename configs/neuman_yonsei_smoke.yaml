# Yonsei RTX 4090 integration diagnostic: full model, short schedule, batch 2.
# Uses the same data, frozen features, SMPL teacher, and 512px render as training.
seed: 2026
data_root: /scratch2/whwjdqls99/LUNA-open/data/neuman/dataset
manifest: /scratch2/whwjdqls99/LUNA-open/data/neuman/manifest-v2.json
features: /scratch2/whwjdqls99/LUNA-open/features/neuman-v2
