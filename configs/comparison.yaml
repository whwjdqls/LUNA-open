# Controlled comparison, independently chosen settings; not a paper reproduction.
# All three methods must use this exact document. Server paths belong in a corpus/model config.
schema_version: 1
seed: 2026
initialization: fresh_reconstruction
objective: shared_photometric
reference_count: 1
image_size: 512
updates: 30000
effective_batch: 16
learning_rate: 0.0004
adam_betas: [0.9, 0.95]
weight_decay: 0.0005
gradient_clip: 0.1
warmup_updates: 1000
validate_every: 500
checkpoint_every: 500
precision: bfloat16
background: white
loss_weights:
  rgb: 1.0
  mask: 1.0
  lpips: 1.0
